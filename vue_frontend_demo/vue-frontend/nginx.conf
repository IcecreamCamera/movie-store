server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 모드 지원
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 프록시 → API Gateway (프론트는 VITE_API_BASE_URL로 직접 호출하지만, 예비용으로 둔다)
    location /api {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # 인증 관련 경로는 프론트(:3000)와 동일 출처로 프록시한다.
    # 브라우저가 302 리다이렉트 체인을 따라갈 때 cross-origin이면 Origin: null이 되어
    # 게이트웨이 CORS 설정(허용 오리진: http://localhost:3000)에 막힐 수 있으므로,
    # 로그인/로그아웃/인가 흐름 전체를 동일 출처로 유지한다.
    # X-Forwarded-Host는 $host가 아니라 $http_host를 쓴다: $host는 포트를 잘라내므로
    # auth-server(Spring의 ForwardedHeaderFilter)가 이를 그대로 쓰면 포트 없는(:3000이 빠진,
    # 즉 기본 80번으로 취급되는) 리다이렉트 Location을 만들어 체인이 끊긴다. $http_host는
    # 클라이언트가 보낸 Host 헤더(포트 포함)를 그대로 전달해 이 문제를 막는다.
    location /oauth2 {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # /login 은 SPA 라우트(앱 로그인 화면)와 auth-server 폼 로그인 엔드포인트가 겹친다.
    # GET  -> SPA 를 서빙해야 앱 로그인 화면이 보인다.
    #         (실패 시 auth-server 가 /login?error 로 되돌리는 것도 GET 이라 여기로 온다.
    #          최종 URL 로 실패를 판정하므로 SPA 를 보여주는 편이 맞다.)
    # POST -> auth-server 의 폼 로그인 필터가 처리해야 세션이 생긴다.
    location = /login {
        # proxy_set_header 는 location 레벨에 두어야 if 안의 proxy_pass 에도 적용된다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        if ($request_method = POST) {
            proxy_pass http://api-gateway:8080;
        }
        try_files $uri /index.html;
    }

    location /logout {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /userinfo {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
